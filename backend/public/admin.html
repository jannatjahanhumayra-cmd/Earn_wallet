<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | Watch & Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #121212; --bg-card: #1e1e1e; --bg-hover: #2c2c2c;
      --primary: #f59e0b; --text-main: #f3f4f6; --text-muted: #9ca3af;
      --border: #333333; --danger: #ef4444; --success: #10b981;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); padding-bottom: 20px; }

    /* Header */
    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
    }
    .admin-header h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .admin-header h1 i { color: var(--primary); }
    
    /* Main Container */
    .container { padding: 20px; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--bg-card); padding: 15px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-card h3 { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .stat-card h2 { font-size: 24px; font-weight: 700; }

    /* Buttons */
    .btn { background: var(--primary); color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; width: 100%; margin-bottom: 20px; }
    .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }

    /* User Card List */
    .user-card { 
      background: var(--bg-card); border: 1px solid var(--border); padding: 15px; border-radius: 10px; 
      margin-bottom: 10px; cursor: pointer; transition: 0.2s;
    }
    .user-card:hover { background: var(--bg-hover); border-color: var(--primary); }
    .user-card-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
    .user-name { font-weight: 600; font-size: 15px; color: var(--primary); }
    .user-id { font-size: 12px; color: var(--text-muted); }
    .user-balance { font-size: 16px; font-weight: bold; color: var(--success); }
    
    .user-details { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border); }
    .user-details.active { display: block; }
    
    .detail-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; }
    .detail-label { color: var(--text-muted); }
    .detail-value { font-weight: 500; }

    /* Action Buttons inside User Details */
    .action-btns { display: flex; gap: 10px; margin-top: 15px; }
    .btn-ban { background: var(--danger); color: white; }
    .btn-unban { background: var(--success); color: white; }
    
    /* Modal / Overlay for loading */
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 999; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="admin-header">
    <h1><i class="fa-solid fa-shield-halved"></i> Admin Panel</h1>
    <span id="admin-status" style="font-size:12px; color:var(--success);">Secure</span>
  </header>

  <div class="container">
    
    <!-- Top Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Users</h3>
        <h2 id="total-users">0</h2>
      </div>
      <div class="stat-card">
        <h3>Active Users</h3>
        <h2 id="active-users">0</h2>
      </div>
    </div>

    <!-- Toggle Button -->
    <button class="btn" onclick="toggleUserManagement()">
      <i class="fa-solid fa-users"></i> User Management
    </button>

    <!-- User List Section (Hidden by default) -->
    <div id="user-list-section" style="display: none;">
      <div id="users-container">
        <!-- User cards will load here -->
      </div>
    </div>

  </div>

  <!-- Loading Spinner -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const initData = tg.initData;
    let allUsers = [];

    function showLoader() { document.getElementById('loadingOverlay').style.display = 'flex'; }
    function hideLoader() { document.getElementById('loadingOverlay').style.display = 'none'; }

    async function fetchAdminData() {
      if (!initData) {
        alert("Please open this Admin Panel inside Telegram App.");
        return;
      }

      showLoader();
      try {
        const res = await fetch('/api/admin/users', {
          headers: { 'Authorization': 'tma ' + initData }
        });
        
        const result = await res.json();
        
        if (result.success) {
          allUsers = result.data;
          updateStats();
          renderUsers();
        } else {
          alert(result.error || "Access Denied");
        }
      } catch (error) {
        console.error(error);
      }
      hideLoader();
    }

    function updateStats() {
      document.getElementById('total-users').innerText = allUsers.length;
      
      const activeCount = allUsers.filter(u => u.status === 'active').length;
      document.getElementById('active-users').innerText = activeCount;
    }

    function renderUsers() {
      const container = document.getElementById('users-container');
      container.innerHTML = '';

      if (allUsers.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No users found.</p>';
        return;
      }

      allUsers.forEach(user => {
        const isBanned = user.status === 'banned';
        const statusText = isBanned ? 'BANNED' : 'ACTIVE';
        const statusColor = isBanned ? 'var(--danger)' : 'var(--success)';
        
        const div = document.createElement('div');
        div.className = 'user-card';
        div.innerHTML = `
          <div class="user-card-header" onclick="toggleUserDetails(this)">
            <div>
              <div class="user-name">${user.firstName || 'Unknown'} ${user.lastName || ''}</div>
              <div class="user-id">ID: ${user.telegramId}</div>
            </div>
            <div style="text-align: right;">
              <div class="user-balance">৳ ${user.balance || 0}</div>
              <div style="font-size: 11px; color: ${statusColor}; font-weight:bold;">${statusText}</div>
            </div>
          </div>
          
          <div class="user-details">
            <div class="detail-row"><span class="detail-label">Telegram Username:</span> <span class="detail-value">@${user.username || 'N/A'}</span></div>
            <div class="detail-row"><span class="detail-label">Total Referrals:</span> <span class="detail-value">${user.referralsCount || 0}</span></div>
            <div class="detail-row"><span class="detail-label">Tasks Completed:</span> <span class="detail-value">${user.completedTasks || 0}</span></div>
            <div class="detail-row"><span class="detail-label">Total Withdrawn:</span> <span class="detail-value">৳ ${user.withdrawnAmount || 0}</span></div>
            <div class="detail-row"><span class="detail-label">Joined On:</span> <span class="detail-value">${new Date(user.createdAt).toLocaleDateString()}</span></div>
            
            <div class="action-btns">
              ${isBanned 
                ? `<button class="btn btn-unban" onclick="changeUserStatus('${user.telegramId}', 'active')">Unban User</button>`
                : `<button class="btn btn-ban" onclick="changeUserStatus('${user.telegramId}', 'banned')">Ban User</button>`
              }
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleUserDetails(headerElement) {
      const details = headerElement.nextElementSibling;
      details.classList.toggle('active');
    }

    function toggleUserManagement() {
      const section = document.getElementById('user-list-section');
      section.style.display = section.style.display === 'none' ? 'block' : 'none';
    }

    async function changeUserStatus(telegramId, newStatus) {
      if(!confirm(`Are you sure you want to mark this user as ${newStatus}?`)) return;
      
      showLoader();
      try {
        const res = await fetch('/api/admin/ban', {
          method: 'POST',
          headers: { 
            'Authorization': 'tma ' + initData,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ telegramId, status: newStatus })
        });
        
        const result = await res.json();
        if(result.success) {
          // লোকাল ডাটা আপডেট করে UI রিফ্রেশ করা
          const user = allUsers.find(u => u.telegramId === telegramId);
          if(user) user.status = newStatus;
          updateStats();
          renderUsers();
        } else {
          alert(result.error);
        }
      } catch(e) {
        console.error(e);
      }
      hideLoader();
    }

    // Initial Fetch
    fetchAdminData();

  </script>
</body>
</html>
