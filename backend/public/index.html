<!DOCTYPE html>
<html lang="bn">
<head>

  <title>EarnWallet | Tasks & Rewards</title>
  <link rel="stylesheet" href="/style.css?v=10">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    window.EW_AD_LINK = 'https://auctionr.org/4/dbdbab1f1b496a0618bffd138f62f643';
    window.openSponsoredLink = function () {
      const url = window.EW_AD_LINK;
      if (!url) return;
      if (window.Telegram?.WebApp?.openLink) window.Telegram.WebApp.openLink(url);
      else window.open(url, '_blank', 'noopener,noreferrer');

  </script>
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Header -->
    <header class="app-header">

      <div class="header-actions">

        <button id="menuToggle" class="icon-btn" aria-label="মেনু" aria-expanded="false">
