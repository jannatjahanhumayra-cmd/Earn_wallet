<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch & Earn - Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <img id="user-avatar" src="https://via.placeholder.com/40" alt="Avatar">
                <div>
                    <h3 id="user-name">Loading...</h3>
                    <span class="badge" id="user-id">ID: ...</span>
                </div>
            </div>
            <div class="notification-icon">
                <i class="fa-solid fa-bell"></i>
            </div>
        </header>

        <!-- Top Banner Ad Placement -->
        <div class="ad-banner" id="banner-top">
            <span>[ Banner Ad 1 ]</span>
        </div>

        <!-- Dashboard View -->
        <main class="main-content" id="view-home">
            <!-- Balance Card -->
            <div class="balance-card">
                <p>Available Balance</p>
                <h1 id="balance-amount">$0.00</h1>
                <div class="wallet-stats">
                    <div>
                        <small>Today</small>
                        <span id="today-earnings">$0.00</span>
                    </div>
                    <div>
                        <small>Total Earned</small>
                        <span id="total-earnings">$0.00</span>
                    </div>
                </div>
            </div>

            <!-- Middle Banner Ad Placement -->
            <div class="ad-banner" id="banner-middle">
                <span>[ Banner Ad 2 ]</span>
            </div>

            <!-- Statistics Grid -->
            <div class="stats-grid">
                <div class="stat-box">
                    <i class="fa-solid fa-users"></i>
                    <span id="stat-referrals">0</span>
                    <p>Referrals</p>
                </div>
                <div class="stat-box">
                    <i class="fa-solid fa-tasks"></i>
                    <span id="stat-tasks">0</span>
                    <p>Completed Tasks</p>
                </div>
                <div class="stat-box">
                    <i class="fa-solid fa-clock"></i>
                    <span id="stat-pending">0</span>
                    <p>Pending Tasks</p>
                </div>
                <div class="stat-box">
                    <i class="fa-solid fa-wallet"></i>
                    <span id="stat-withdrawn">$0.00</span>
                    <p>Withdrawn</p>
                </div>
            </div>

            <!-- Bottom Banner Ad Placement -->
            <div class="ad-banner" id="banner-bottom">
                <span>[ Banner Ad 3 ]</span>
            </div>
        </main>

        <!-- Dynamic Dynamic Sections Container (Earn, Tasks, Referral, History, Withdraw, Profile) -->
        <div id="dynamic-view" class="dynamic-view" style="display: none;"></div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"><span>Home</span></i></button>
            <button class="nav-item" onclick="switchTab('earn', this)"><i class="fa-solid fa-play"><span>Earn</span></i></button>
            <button class="nav-item" onclick="switchTab('tasks', this)"><i class="fa-solid fa-list-check"><span>Tasks</span></i></button>
            <button class="nav-item" onclick="switchTab('referral', this)"><i class="fa-solid fa-user-plus"><span>Referral</span></i></button>
            <button class="nav-item" onclick="switchTab('withdraw', this)"><i class="fa-solid fa-wallet"><span>Withdraw</span></i></button>
            <button class="nav-item" onclick="switchTab('profile', this)"><i class="fa-solid fa-user"><span>Profile</span></i></button>
        </nav>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
